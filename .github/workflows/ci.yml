name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: empatelive
          POSTGRES_PASSWORD: empatelive
          POSTGRES_DB: empatelive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U empatelive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://empatelive:empatelive@localhost:5432/empatelive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar postgresql-client-16 (pg_dump/pg_restore para los tests de backup)
        # Versión fijada a 16 para que coincida con postgres:16-alpine (Anexo D).
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migraciones en limpio
        run: alembic upgrade head

      - name: Seed de desarrollo
        run: python -m seed.seed

      - name: Tests
        run: pytest

      - name: openapi.json al día
        run: |
          python -m scripts.exportar_openapi
          git diff --exit-code openapi.json

  simulador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulador
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
