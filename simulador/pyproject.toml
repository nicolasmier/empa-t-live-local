[project]
name = "empatelive-simulador"
version = "0.1.0"
description = "Simulador de corredores para pruebas de carga del servidor (spec v10, plan S4)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "gpxpy>=1.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
simulador = "simulador.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulador*"]
