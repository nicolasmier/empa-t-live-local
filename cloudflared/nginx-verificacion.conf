# Simula localmente el ingress de cloudflared/config.yml (mismo patrón de rutas)
# para poder probar la restricción de superficie SIN una cuenta real de
# Cloudflare (Anexo B §2: "la separación se implementa a nivel de reverse
# proxy/túnel, no confiando únicamente en la autenticación").
events {}

http {
  server {
    listen 80;

    location ~ ^/(auth/corredores/(registro|login)|corredores/[^/]+(/foto)?|eventos/codigo/[^/]+/unirse|inscripciones/[^/]+/estado|eventos/[^/]+/posiciones)$ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
    }

    location / {
      return 404;
    }
  }
}
