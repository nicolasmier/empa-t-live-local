# Túnel Cloudflare (spec v10 Anexo D + Anexo B §2): enruta ÚNICAMENTE la API del
# corredor. El panel, la web pública y el resto de la API de gestión NUNCA deben
# ser alcanzables desde este hostname, aunque se filtre un token (Anexo E).
#
# Requiere haber creado antes un tunnel nombrado con tu propia cuenta y dominio
# de Cloudflare (SUP-006) — ver docs/guia_tunel_cloudflare.md paso a paso.
# `cloudflared tunnel create <nombre>` genera <TUNNEL_ID> y credentials.json;
# sustituye los placeholders de abajo por esos valores reales.

tunnel: a5057d96-2cd2-4936-88be-ff654759f19a
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: api.observeweb.com
    # Alcance (Anexo B §2, idéntico a cloudflared/nginx-verificacion.conf). Dos
    # bloques dentro de la misma regex:
    #   1) API del corredor (escritura): login/registro, perfil propio + foto,
    #      unirse con código, estado de la inscripción, ingesta de posiciones.
    #   2) Lectura pública para la web de seguimiento en internet: evento activo,
    #      distancias, posiciones por distancia, noticias, patrocinadores y los
    #      media de fotos/gpx.
    # NUNCA rutas de gestión, y `media/(fotos|gpx|carteles)/` deja FUERA
    # `media/backups/` (los volcados cifrados de la BD se guardan en
    # storage/backups → /media/backups). fotos=corredores, gpx=recorridos,
    # carteles=cartel del evento (todo contenido público mostrado en la web).
    path: ^/(auth/corredores/(registro|login)|corredores/[^/]+(/foto)?|eventos/codigo/[^/]+/unirse|inscripciones/[^/]+/estado|eventos/[^/]+/posiciones|eventos/activo|eventos/[^/]+/distancias|eventos/[^/]+/distancias/[^/]+/posiciones|eventos/[^/]+/(noticias|patrocinadores)|media/(fotos|gpx|carteles)/.+)$
    service: http://api:8000
  # Catch-all: cualquier otra ruta (gestión, /media/backups, /salud...) responde
  # 404 en el propio túnel, sin llegar siquiera a la API.
  - service: http_status:404
